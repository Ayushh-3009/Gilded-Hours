// ===== REMINDERS PAGE =====
function RemindersPage({ reminders, setReminders, onLogActivity }) {
  const [view, setView] = useState('upcoming'); // 'upcoming', 'all', 'completed'
  const [showForm, setShowForm] = useState(false);
  const [editingReminder, setEditingReminder] = useState(null);
  const [searchTerm, setSearchTerm] = useState('');

  const nowMinutes = new Date().toISOString().slice(0, 16);

  const filtered = useMemo(() => {
    let list = reminders;
    if (searchTerm) {
      const q = searchTerm.toLowerCase();
      list = list.filter(r => r.title.toLowerCase().includes(q) || (r.note && r.note.toLowerCase().includes(q)));
    }
    if (view === 'upcoming') {
      return list.filter(r => r.status === 'pending').sort((a,b) => (a.datetime || '').localeCompare(b.datetime || ''));
    } else if (view === 'completed') {
      return list.filter(r => r.status === 'completed' || r.status === 'dismissed');
    }
    return [...list].sort((a,b) => (a.datetime || '').localeCompare(b.datetime || ''));
  }, [reminders, view, searchTerm]);

  const toggleReminder = (id) => {
    setReminders(prev => prev.map(r => {
      if (r.id !== id) return r;
      const isDone = r.status === 'completed';
      const newStatus = isDone ? 'pending' : 'completed';
      if (!isDone && onLogActivity) {
        onLogActivity('reminder', `Completed reminder: "${r.title}"`, '🔔', r.note || 'Marked done');
      }
      return { ...r, status: newStatus };
    }));
  };

  const snoozeReminder = (id, minutes = 15) => {
    const now = new Date();
    now.setMinutes(now.getMinutes() + minutes);
    const newDatetime = now.toISOString().slice(0, 16);
    setReminders(prev => prev.map(r => {
      if (r.id !== id) return r;
      if (onLogActivity) {
        onLogActivity('reminder', `Snoozed reminder: "${r.title}" (+${minutes}m)`, '⏰', `Rescheduled to ${newDatetime.replace('T', ' ')}`);
      }
      return { ...r, datetime: newDatetime, status: 'pending' };
    }));
  };

  const deleteReminder = (id) => {
    setReminders(prev => prev.filter(r => r.id !== id));
  };

  const saveReminder = (item) => {
    if (editingReminder) {
      setReminders(prev => prev.map(r => r.id === editingReminder.id ? { ...editingReminder, ...item } : r));
      if (onLogActivity) {
        onLogActivity('reminder', `Updated reminder: "${item.title}"`, '🔔', `Due: ${item.datetime?.replace('T', ' ')}`);
      }
    } else {
      const newReminder = { ...item, id: uid(), status: 'pending', createdAt: td };
      setReminders(prev => [newReminder, ...prev]);
      if (onLogActivity) {
        onLogActivity('reminder', `Created reminder: "${item.title}"`, '🔔', `Due: ${item.datetime?.replace('T', ' ')}`);
      }
    }
    setEditingReminder(null);
    setShowForm(false);
  };

  const getTypeIcon = (type) => {
    switch (type) {
      case 'wellness': return '🌿';
      case 'task': return '📋';
      case 'habit': return '🔥';
      case 'routine': return '🔄';
      case 'journal': return '📝';
      default: return '🔔';
    }
  };

  const formatReminderTime = (dt) => {
    if (!dt) return '';
    const [datePart, timePart] = dt.split('T');
    let dateLabel = fmtDate(datePart);
    if (datePart === td) dateLabel = 'Today';
    else if (datePart === tmr) dateLabel = 'Tomorrow';

    if (timePart) {
      const [h, m] = timePart.split(':');
      const hour = parseInt(h, 10);
      const ampm = hour >= 12 ? 'PM' : 'AM';
      const formattedHour = hour % 12 || 12;
      return `${dateLabel} at ${formattedHour}:${m} ${ampm}`;
    }
    return dateLabel;
  };

  const pendingCount = reminders.filter(r => r.status === 'pending').length;
  const completedCount = reminders.filter(r => r.status === 'completed' || r.status === 'dismissed').length;

  return (
    <div className="fade-in">
      <div className="page-header">
        <h2>🔔 Reminders</h2>
        <p>Gentle nudges, mindful alerts, and scheduled cues throughout your day.</p>
        <div className="page-header-actions" style={{flexWrap:'wrap'}}>
          <button className="btn btn-primary" onClick={() => { setEditingReminder(null); setShowForm(true); }}>
            + New Reminder
          </button>
          <button className="btn btn-secondary btn-sm" onClick={playCozyChime} title="Test harmonic cozy chime">
            🎵 Test Chime
          </button>
          <div className="search-bar" style={{flex:1, minWidth:200, maxWidth:300}}>
            <span className="search-icon">🔍</span>
            <input className="input" placeholder="Search reminders..." value={searchTerm} onChange={e => setSearchTerm(e.target.value)} />
          </div>
        </div>
      </div>

      <div className="tabs">
        {[
          { key: 'upcoming', label: `Upcoming & Due (${pendingCount})` },
          { key: 'all', label: `All (${reminders.length})` },
          { key: 'completed', label: `Completed (${completedCount})` },
        ].map(tab => (
          <div key={tab.key} className={`tab ${view === tab.key ? 'active' : ''}`} onClick={() => setView(tab.key)}>
            {tab.label}
          </div>
        ))}
      </div>

      {filtered.length === 0 ? (
        <EmptyState
          icon={view === 'completed' ? '🏆' : '🔔'}
          title={view === 'completed' ? 'No completed reminders yet' : 'No upcoming reminders'}
          desc={view === 'completed' ? 'Completed reminders will appear here.' : 'Add a reminder to stay gently nudged on what matters.'}
          action={view !== 'completed' && (
            <button className="btn btn-primary" onClick={() => { setEditingReminder(null); setShowForm(true); }}>
              + Add Reminder
            </button>
          )}
        />
      ) : (
        <div>
          {filtered.map(r => {
            const isCompleted = r.status === 'completed' || r.status === 'dismissed';
            const isDue = !isCompleted && r.datetime && r.datetime <= nowMinutes;
            return (
              <div key={r.id} className={`reminder-item slide-in ${isDue ? 'due' : ''} ${isCompleted ? 'completed' : ''}`}>
                <Checkbox checked={isCompleted} onChange={() => toggleReminder(r.id)} priority={r.priority} />
                <div className="reminder-icon-box">{getTypeIcon(r.type)}</div>
                <div className="reminder-info">
                  <div style={{display:'flex', alignItems:'center', gap:8}}>
                    <span className="reminder-title">{r.title}</span>
                    {isDue && <span className="chip chip-warning">⚠️ Due Now</span>}
                  </div>
                  {r.note && <div className="reminder-note">{r.note}</div>}
                  <div className="reminder-meta">
                    <span>⏰ {formatReminderTime(r.datetime)}</span>
                    {r.priority && r.priority !== 'none' && (
                      <span className={`chip chip-${PRIORITIES[r.priority]?.color || 'violet'}`}>
                        {PRIORITIES[r.priority]?.label || r.priority}
                      </span>
                    )}
                    {r.repeat && r.repeat !== 'none' && (
                      <span className="chip chip-blue">🔄 {r.repeat}</span>
                    )}
                  </div>
                </div>
                <div style={{display:'flex', alignItems:'center', gap:6}}>
                  {!isCompleted && (
                    <button className="btn btn-secondary btn-sm" onClick={() => snoozeReminder(r.id, 15)} title="Snooze 15 minutes">
                      ⏰ +15m
                    </button>
                  )}
                  <button className="btn btn-ghost btn-sm" onClick={() => { setEditingReminder(r); setShowForm(true); }} title="Edit">
                    ✏️
                  </button>
                  <button className="btn btn-ghost btn-sm" onClick={() => deleteReminder(r.id)} title="Delete">
                    🗑️
                  </button>
                </div>
              </div>
            );
          })}
        </div>
      )}

      {/* Reminder Form Modal */}
      <ReminderFormModal
        open={showForm}
        onClose={() => { setShowForm(false); setEditingReminder(null); }}
        onSave={saveReminder}
        reminder={editingReminder}
      />
    </div>
  );
}

function ReminderFormModal({ open, onClose, onSave, reminder }) {
  const [title, setTitle] = useState('');
  const [date, setDate] = useState(td);
  const [time, setTime] = useState('14:00');
  const [type, setType] = useState('wellness');
  const [priority, setPriority] = useState('medium');
  const [repeat, setRepeat] = useState('none');
  const [note, setNote] = useState('');

  useEffect(() => {
    if (reminder) {
      setTitle(reminder.title);
      if (reminder.datetime) {
        const parts = reminder.datetime.split('T');
        setDate(parts[0] || td);
        setTime(parts[1] || '12:00');
      }
      setType(reminder.type || 'wellness');
      setPriority(reminder.priority || 'medium');
      setRepeat(reminder.repeat || 'none');
      setNote(reminder.note || '');
    } else {
      setTitle('');
      setDate(td);
      const now = new Date();
      now.setMinutes(now.getMinutes() + 30);
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');

      setRepeat('none');

      priority,
      repeat,

  return (
    <Modal

        <div className="form-group">

      </div>

      <div className="form-row">
        <div className="form-group">
          <label className="form-label">Category</label>
          <select className="select" value={type} onChange={e => setType(e.target.value)}>

// ===== PAST ACTIVITY RECORDS PAGE =====
function ActivityPage({ activity, setActivity, tasks, habits, routines, journal }) {
  const [filterType, setFilterType] = useState('all'); // 'all', 'task', 'habit', 'routine', 'journal', 'planner', 'reminder'
  const [timeRange, setTimeRange] = useState('all'); // 'all', 'today', 'yesterday', '7days', '30days'
  const [searchTerm, setSearchTerm] = useState('');

  // Summary Metrics
  const totalEntries = activity.length;
  const completedTasksCount = tasks.filter(t => t.completed).length;
  const totalHabits = habits.length;
  const totalJournalCount = journal.length;

  const filtered = useMemo(() => {
    let list = activity;
    if (filterType !== 'all') {
      list = list.filter(a => a.type === filterType);
    }
    if (timeRange === 'today') {
      list = list.filter(a => a.date === td);
    } else if (timeRange === 'yesterday') {
      list = list.filter(a => a.date === y1);
    } else if (timeRange === '7days') {
      const sevenDaysAgo = addDays(td, -7);
      list = list.filter(a => a.date >= sevenDaysAgo);
    } else if (timeRange === '30days') {
      const thirtyDaysAgo = addDays(td, -30);
      list = list.filter(a => a.date >= thirtyDaysAgo);
    }
    if (searchTerm) {
      const q = searchTerm.toLowerCase();
      list = list.filter(a => (a.title && a.title.toLowerCase().includes(q)) || (a.details && a.details.toLowerCase().includes(q)));
    }
    return [...list].sort((a,b) => (b.timestamp || 0) - (a.timestamp || 0) || (b.date || '').localeCompare(a.date || ''));
  }, [activity, filterType, timeRange, searchTerm]);

  // Group by date
  const groupedByDate = useMemo(() => {
    const groups = {};
    filtered.forEach(item => {
      const d = item.date || td;
      if (!groups[d]) groups[d] = [];
      groups[d].push(item);
    });
    return groups;
  }, [filtered]);

  const handleExport = () => {
    const exportData = {
      exportedAt: new Date().toISOString(),
      appName: 'Gilded Hours',
      totalRecords: activity.length,
      activity
    };
    const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `gilded_hours_activity_${td}.json`;
    a.click();
    URL.revokeObjectURL(url);
  };

  const handleClearHistory = () => {
    if (window.confirm('Are you sure you want to clear your past activity history? This will reset the timeline.')) {
      setActivity([]);
    }
  };

  const sortedDates = Object.keys(groupedByDate).sort((a,b) => b.localeCompare(a));

  return (
    <div className="fade-in">
      <div className="page-header">
        <h2>📜 Past Activity Records</h2>
        <p>A continuous, mindful history of everything you've accomplished and reflected upon.</p>
        <div className="page-header-actions" style={{flexWrap:'wrap'}}>
          <button className="btn btn-secondary btn-sm" onClick={handleExport} title="Export activity history">
            📥 Export History
          </button>
          {activity.length > 0 && (
            <button className="btn btn-ghost btn-sm" onClick={handleClearHistory} title="Clear history">
              🗑️ Clear
            </button>
          )}
          <div className="search-bar" style={{flex:1, minWidth:200, maxWidth:300}}>
            <span className="search-icon">🔍</span>
            <input className="input" placeholder="Search activity records..." value={searchTerm} onChange={e => setSearchTerm(e.target.value)} />
          </div>
        </div>
      </div>

      {/* Stats Summary Grid */}
      <div className="activity-stats-grid">
        <div className="activity-stat-card">
          <div className="activity-stat-num">{totalEntries}</div>
          <div className="activity-stat-label">Milestones Logged</div>
        </div>
        <div className="activity-stat-card">
          <div className="activity-stat-num">{completedTasksCount}</div>
          <div className="activity-stat-label">Tasks Completed</div>
        </div>
        <div className="activity-stat-card">
          <div className="activity-stat-num">{totalHabits}</div>
          <div className="activity-stat-label">Active Habits</div>
        </div>
        <div className="activity-stat-card">
          <div className="activity-stat-num">{totalJournalCount}</div>
          <div className="activity-stat-label">Reflections Recorded</div>
        </div>
      </div>

      {/* Filters: Category Pills */}
      <div className="tabs" style={{overflowX:'auto', flexWrap:'nowrap'}}>
        {[
          { key: 'all', label: `All (${activity.length})` },
          { key: 'task', label: '✅ Tasks' },
          { key: 'habit', label: '🔥 Habits' },
          { key: 'routine', label: '🔄 Routines' },
          { key: 'journal', label: '📝 Journal' },
          { key: 'planner', label: '🕐 Planner' },
          { key: 'reminder', label: '🔔 Reminders' },
          { key: 'profile', label: '👤 Profile' },
        ].map(tab => (
          <div key={tab.key} className={`tab ${filterType === tab.key ? 'active' : ''}`} onClick={() => setFilterType(tab.key)}>
            {tab.label}
          </div>
        ))}
      </div>

      {/* Secondary filter: Date Range */}
      <div style={{display:'flex', gap:8, alignItems:'center', marginBottom:20, flexWrap:'wrap'}}>
        <span style={{fontSize:'0.82rem', color:'var(--text-muted)'}}>Time range:</span>
        {[
          { key: 'all', label: 'All Time' },
          { key: 'today', label: 'Today' },
          { key: 'yesterday', label: 'Yesterday' },
          { key: '7days', label: 'Past 7 Days' },
          { key: '30days', label: 'This Month' },
        ].map(r => (
          <button
            key={r.key}
            className={`btn btn-sm ${timeRange === r.key ? 'btn-primary' : 'btn-secondary'}`}
            style={{padding:'4px 10px', fontSize:'0.78rem'}}
            onClick={() => setTimeRange(r.key)}
          >
            {r.label}
          </button>
        ))}
      </div>

      {/* Timeline Stream */}
      {sortedDates.length === 0 ? (
        <EmptyState
          icon="📜"
          title="No activity records yet"
          desc={searchTerm ? 'No activity matches your search filter.' : 'Your real actions and milestones will automatically appear here as you complete tasks, build habits, and plan your day.'}
        />
      ) : (
        sortedDates.map(dateKey => {
          const items = groupedByDate[dateKey];
          let dateHeader = fmtDateFull(dateKey);
          if (dateKey === td) dateHeader = `📍 Today — ${fmtDateFull(dateKey)}`;
          else if (dateKey === y1) dateHeader = `Yesterday — ${fmtDateFull(dateKey)}`;

          return (
            <div key={dateKey} style={{marginBottom: 28}}>
              <div style={{fontWeight: 700, fontSize: '1rem', color: 'var(--violet-200)', marginBottom: 14, display:'flex', alignItems:'center', gap:8}}>
                <span>📅</span>
                <span>{dateHeader}</span>
                <span style={{fontSize: '0.78rem', color: 'var(--text-muted)', fontWeight: 500}}>({items.length} {items.length === 1 ? 'record' : 'records'})</span>
              </div>

              <div className="timeline-stream">
                {items.map(item => (
                  <div key={item.id} className="timeline-entry">
                    <div className="timeline-dot" />
                    <div className="timeline-card">
                      <div className="timeline-header">
                        <div className="timeline-title">
                          <span>{item.icon || '✨'}</span>
                          <span>{item.title}</span>
                        </div>
                        <div className="timeline-time">{item.time || ''}</div>
                      </div>
                      {item.details && <div className="timeline-details">{item.details}</div>}
                      <div className="timeline-tags">
                        <span className="chip chip-violet">{item.type?.toUpperCase()}</span>
                        <span className="chip chip-blue">{fmtDate(item.date)}</span>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          );
        })
      )}
    </div>
  );
}

// ===== AUTHENTICATION SCREEN =====
function AuthScreen({ onLogin }) {
  const [mode, setMode] = useState(() => getRegisteredUsers().length > 0 ? 'signin' : 'signup'); // 'signin' or 'signup'

  // Sign In form state
  const [loginIdentifier, setLoginIdentifier] = useState('');
  const [loginPassword, setLoginPassword] = useState('');
  const [showLoginPassword, setShowLoginPassword] = useState(false);

  // Sign Up form state
  const [signupName, setSignupName] = useState('');
  const [signupUsername, setSignupUsername] = useState('');
  const [signupEmail, setSignupEmail] = useState('');
  const [signupPassword, setSignupPassword] = useState('');
  const [signupConfirmPassword, setSignupConfirmPassword] = useState('');
  const [showSignupPassword, setShowSignupPassword] = useState(false);
  const [selectedAvatar, setSelectedAvatar] = useState('✨');

  // Alerts
  const [errorMsg, setErrorMsg] = useState('');
  const [successMsg, setSuccessMsg] = useState('');

  const avatarOptions = ['✨', '🌸', '☕', '🌿', '🌙', '🕯️', '🎧', '🪐', '🦊', '🍵', '🎨', '💫'];

  const handleSignIn = (e) => {
    if (e) e.preventDefault();
    setErrorMsg('');
    setSuccessMsg('');

    const identifier = loginIdentifier.trim().toLowerCase();
    const password = loginPassword;

    if (!identifier || !password) {
      setErrorMsg('Please enter your username/email and password.');
      return;
    }

    const users = getRegisteredUsers();
    const user = users.find(u =>
      (u.username?.toLowerCase() === identifier || u.email?.toLowerCase() === identifier) &&
      u.password === password
    );

    if (!user) {
      setErrorMsg('Invalid email/username or password. Please try again.');
      return;
    }

    setSuccessMsg(`Welcome back, ${user.name}! Opening your planner...`);
    setTimeout(() => {
      onLogin(user);
    }, 300);
  };

  const handleSignUp = (e) => {
    if (e) e.preventDefault();
    setErrorMsg('');
    setSuccessMsg('');

    const name = signupName.trim();
    const username = signupUsername.trim().toLowerCase();
    const email = signupEmail.trim().toLowerCase();
    const password = signupPassword;

    if (!name || !username || !email || !password) {
      setErrorMsg('Please fill in all required fields.');
      return;
    }

    if (username.length < 3) {
      setErrorMsg('Username must be at least 3 characters.');
      return;
    }

    if (!email.includes('@') || !email.includes('.')) {
      setErrorMsg('Please enter a valid email address.');
      return;
    }

    if (password.length < 4) {
      setErrorMsg('Password must be at least 4 characters.');
      return;
    }

    if (password !== signupConfirmPassword) {
      setErrorMsg('Passwords do not match.');
      return;
    }

    const users = getRegisteredUsers();
    const exists = users.some(u =>
      u.username?.toLowerCase() === username || u.email?.toLowerCase() === email
    );

    if (exists) {
      setErrorMsg('An account with this username or email already exists. Please sign in instead.');
      return;
    }

    const newUser = {
      id: uid(),
      name,
      username,
      email,
      password,
      avatar: selectedAvatar || '✨',
      bio: '',
      affirmation: '',
      themeAccent: '#7C3AED',
      createdAt: today()
    };

    // Save to registered users
    users.push(newUser);
    saveRegisteredUsers(users);

    // Initialize clean personal storage for this user
    save(getUserKey(newUser.id, 'tasks'), []);
    save(getUserKey(newUser.id, 'blocks'), []);
    save(getUserKey(newUser.id, 'habits'), []);
    save(getUserKey(newUser.id, 'routines'), []);
    save(getUserKey(newUser.id, 'journal'), []);
    save(getUserKey(newUser.id, 'reminders'), []);
    save(getUserKey(newUser.id, 'activity'), []);
    purgeAllFakeUserData(newUser.id);

    setSuccessMsg(`Account created! Welcome to Gilded Hours, ${name}...`);
    setTimeout(() => {
      onLogin(newUser);
    }, 400);
  };

  return (
    <div className="auth-wrapper">
      <div className="auth-ambient-glow" />
      <div className="auth-card">
        <div className="auth-logo-header">
          <div className="auth-logo-badge">⏳</div>
          <h1 className="auth-title">Gilded Hours</h1>
          <p className="auth-subtitle">Your quiet sanctuary for focus, habits, and daily reflection.</p>
        </div>

        <div className="auth-tabs-nav">
          <button
            type="button"
            className={`auth-tab-btn ${mode === 'signin' ? 'active' : ''}`}
            onClick={() => { setMode('signin'); setErrorMsg(''); setSuccessMsg(''); }}
          >
            Sign In
          </button>
          <button
            type="button"
            className={`auth-tab-btn ${mode === 'signup' ? 'active' : ''}`}
            onClick={() => { setMode('signup'); setErrorMsg(''); setSuccessMsg(''); }}
          >
            Create Account
          </button>
        </div>

        {errorMsg && (
          <div className="auth-alert-box auth-alert-error">
            <span>⚠️</span>
            <span>{errorMsg}</span>
          </div>
        )}

        {successMsg && (
          <div className="auth-alert-box auth-alert-success">
            <span>✨</span>
            <span>{successMsg}</span>
          </div>
        )}

        {mode === 'signin' ? (
          <form onSubmit={handleSignIn}>
            <div className="form-group">
              <label className="form-label">Username or Email</label>
              <input
                className="input"
                type="text"
                placeholder="e.g. your_username or you@email.com"
                value={loginIdentifier}
                onChange={e => setLoginIdentifier(e.target.value)}
                autoFocus
              />
            </div>

            <div className="form-group">
              <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:6}}>
                <label className="form-label" style={{marginBottom:0}}>Password</label>
                <button
                  type="button"
                  style={{background:'none', border:'none', color:'var(--violet-400)', fontSize:'0.75rem', cursor:'pointer'}}
                  onClick={() => setShowLoginPassword(!showLoginPassword)}
                >
                  {showLoginPassword ? 'Hide' : 'Show'}
                </button>
              </div>
              <input
                className="input"
                type={showLoginPassword ? 'text' : 'password'}
                placeholder="••••••••"
                value={loginPassword}
                onChange={e => setLoginPassword(e.target.value)}
              />
            </div>

            <button type="submit" className="btn btn-primary" style={{width:'100%', padding:'12px', marginTop:8}}>
              Sign In to Sanctuary →
            </button>
          </form>
        ) : (
          <form onSubmit={handleSignUp}>
            <div className="form-group">
              <label className="form-label">Your Name</label>
              <input
                className="input"
                type="text"
                placeholder="e.g. Maya"
                value={signupName}
                onChange={e => setSignupName(e.target.value)}
                autoFocus
              />
            </div>

            <div className="form-row">
              <div className="form-group">
                <label className="form-label">Username</label>
                <input
                  className="input"
                  type="text"
                  placeholder="e.g. maya"
                  value={signupUsername}
                  onChange={e => setSignupUsername(e.target.value)}
                />
              </div>
              <div className="form-group">
                <label className="form-label">Email</label>
                <input
                  className="input"
                  type="email"
                  placeholder="maya@example.com"
                  value={signupEmail}
                  onChange={e => setSignupEmail(e.target.value)}
                />
              </div>
            </div>

            <div className="form-row">
              <div className="form-group">
                <label className="form-label">Password</label>
                <input
                  className="input"
                  type={showSignupPassword ? 'text' : 'password'}
                  placeholder="••••••••"
                  value={signupPassword}
                  onChange={e => setSignupPassword(e.target.value)}
                />
              </div>
              <div className="form-group">
                <label className="form-label">Confirm Password</label>
                <input
                  className="input"
                  type={showSignupPassword ? 'text' : 'password'}
                  placeholder="••••••••"
                  value={signupConfirmPassword}
                  onChange={e => setSignupConfirmPassword(e.target.value)}
                />
              </div>
            </div>

            <div className="form-group">
              <label className="form-label">Profile Avatar</label>
              <CustomAvatarPicker avatar={selectedAvatar} onChange={setSelectedAvatar} />
            </div>


            <button type="submit" className="btn btn-primary" style={{width:'100%', padding:'12px', marginTop:8}}>
              Create Account & Enter →
            </button>
          </form>
        )}
      </div>
    </div>
  );
}

// ===== AUTHENTICATED APPLICATION =====
function AuthenticatedApp({ user, onLogout, onUpdateUser }) {
  const [page, setPage] = useState('dashboard');
  const [showProfileModal, setShowProfileModal] = useState(false);

  // Apply cozy theme accent color
  useEffect(() => {
    if (user?.themeAccent) {
      applyThemeAccent(user.themeAccent);
    }
  }, [user?.themeAccent]);

  // Initialize data store specific to this authenticated user with fake data filtering
  const initUserStore = (type, isFakeFn) => {
    const key = getUserKey(user.id, type);
    const existing = load(key);
    if (Array.isArray(existing)) {
      const cleaned = existing.filter(item => !isFakeFn(item));
      save(key, cleaned);
      return cleaned;
    }
    save(key, []);
    return [];
  };

  const [tasks, setTasks] = useState(() => initUserStore('tasks', isFakeTask));
  const [blocks, setBlocks] = useState(() => initUserStore('blocks', isFakeBlock));
  const [habits, setHabits] = useState(() => initUserStore('habits', isFakeHabit));
  const [routines, setRoutines] = useState(() => initUserStore('routines', isFakeRoutine));
  const [journal, setJournal] = useState(() => initUserStore('journal', isFakeJournal));
  const [reminders, setReminders] = useState(() => initUserStore('reminders', isFakeReminder));
  const [activity, setActivity] = useState(() => initUserStore('activity', isFakeActivity));

  // Floating reminder alert state
  const [activeToastReminder, setActiveToastReminder] = useState(null);
  const alertedIdsRef = useRef(new Set());

  // Persist to user's individual storage key whenever data changes
  useEffect(() => { save(getUserKey(user.id, 'tasks'), tasks); }, [tasks, user.id]);
  useEffect(() => { save(getUserKey(user.id, 'blocks'), blocks); }, [blocks, user.id]);
  useEffect(() => { save(getUserKey(user.id, 'habits'), habits); }, [habits, user.id]);
  useEffect(() => { save(getUserKey(user.id, 'routines'), routines); }, [routines, user.id]);
  useEffect(() => { save(getUserKey(user.id, 'journal'), journal); }, [journal, user.id]);
  useEffect(() => { save(getUserKey(user.id, 'reminders'), reminders); }, [reminders, user.id]);
  useEffect(() => { save(getUserKey(user.id, 'activity'), activity); }, [activity, user.id]);

  // Purge any fake records across all tabs if previously cached in state
  useEffect(() => {
    setTasks(prev => {
      const clean = prev.filter(t => !isFakeTask(t));
      if (clean.length !== prev.length) { save(getUserKey(user.id, 'tasks'), clean); return clean; }
      return prev;
    });
    setBlocks(prev => {
      const clean = prev.filter(b => !isFakeBlock(b));
      if (clean.length !== prev.length) { save(getUserKey(user.id, 'blocks'), clean); return clean; }
      return prev;
    });
    setHabits(prev => {
      const clean = prev.filter(h => !isFakeHabit(h));
      if (clean.length !== prev.length) { save(getUserKey(user.id, 'habits'), clean); return clean; }
      return prev;
    });
    setRoutines(prev => {
      const clean = prev.filter(r => !isFakeRoutine(r));
      if (clean.length !== prev.length) { save(getUserKey(user.id, 'routines'), clean); return clean; }
      return prev;
    });
    setJournal(prev => {
      const clean = prev.filter(j => !isFakeJournal(j));
      if (clean.length !== prev.length) { save(getUserKey(user.id, 'journal'), clean); return clean; }
      return prev;
    });
    setReminders(prev => {
      const clean = prev.filter(r => !isFakeReminder(r));
      if (clean.length !== prev.length) { save(getUserKey(user.id, 'reminders'), clean); return clean; }
      return prev;
    });
    setActivity(prev => {
      const clean = prev.filter(a => !isFakeActivity(a));
      if (clean.length !== prev.length) { save(getUserKey(user.id, 'activity'), clean); return clean; }
      return prev;
    });
  }, [user.id]);

  // Central Activity Logger
  const logActivity = (type, title, icon, details, date) => {
    const newEntry = {
      id: uid(),
      type,
      title,
      icon: icon || '✨',
      details: details || '',
      date: date || td,
      time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
      timestamp: Date.now()
    };
    setActivity(prev => [newEntry, ...prev]);
  };

  // Toggle Reminder completion
  const toggleReminder = (id) => {
    setReminders(prev => prev.map(r => {
      if (r.id !== id) return r;
      const isDone = r.status === 'completed';
      const newStatus = isDone ? 'pending' : 'completed';
      if (!isDone) {
        logActivity('reminder', `Completed reminder: "${r.title}"`, '🔔', r.note || 'Marked done');
      }
      return { ...r, status: newStatus };
    }));
  };

  // Real-time Reminder Monitor (checks every 10 seconds)
  useEffect(() => {
    const checkReminders = () => {
      const now = new Date();
      const currentIsoMinutes = now.toISOString().slice(0, 16);

      reminders.forEach(r => {
        if (r.status !== 'pending') return;
        if (alertedIdsRef.current.has(r.id)) return;

        if (r.datetime && r.datetime <= currentIsoMinutes) {
          alertedIdsRef.current.add(r.id);
          setActiveToastReminder(r);
          playCozyChime();

          if (window.Notification && Notification.permission === 'granted') {
            try {
              new Notification(`🔔 Gilded Hours: ${r.title}`, {
                body: r.note || 'Your scheduled reminder is due now.',
              });
            } catch (e) {}
          }
        }
      });
    };

    checkReminders();
    const interval = setInterval(checkReminders, 10000);
    return () => clearInterval(interval);
  }, [reminders]);

  const navItems = [
    { key: 'dashboard', icon: '✨', label: 'Dashboard' },
    { key: 'tasks',     icon: '📋', label: 'Tasks', badge: tasks.filter(t => t.dueDate === td && !t.completed).length || null },
    { key: 'planner',   icon: '🕐', label: 'Planner' },
    { key: 'habits',    icon: '🔥', label: 'Habits' },
    { key: 'routines',  icon: '🔄', label: 'Routines' },
    { key: 'journal',   icon: '📝', label: 'Journal' },
    { key: 'reminders', icon: '🔔', label: 'Reminders', badge: reminders.filter(r => r.status === 'pending' && r.datetime?.startsWith(td)).length || null },
    { key: 'activity',  icon: '📜', label: 'Activity' },
  ];

  const renderPage = () => {
    switch (page) {
      case 'dashboard': return <DashboardPage tasks={tasks} habits={habits} blocks={blocks} routines={routines} journal={journal} reminders={reminders} activity={activity} setPage={setPage} user={user} onToggleReminder={toggleReminder} onOpenProfile={() => setShowProfileModal(true)} />;
      case 'tasks': return <TasksPage tasks={tasks} setTasks={setTasks} onLogActivity={logActivity} />;
      case 'planner': return <PlannerPage blocks={blocks} setBlocks={setBlocks} tasks={tasks} onLogActivity={logActivity} />;
      case 'habits': return <HabitsPage habits={habits} setHabits={setHabits} onLogActivity={logActivity} />;
      case 'routines': return <RoutinesPage routines={routines} setRoutines={setRoutines} onLogActivity={logActivity} />;
      case 'journal': return <JournalPage journal={journal} setJournal={setJournal} onLogActivity={logActivity} />;
      case 'reminders': return <RemindersPage reminders={reminders} setReminders={setReminders} onLogActivity={logActivity} />;
      case 'activity': return <ActivityPage activity={activity} setActivity={setActivity} tasks={tasks} habits={habits} routines={routines} journal={journal} />;
      default: return <DashboardPage tasks={tasks} habits={habits} blocks={blocks} routines={routines} journal={journal} reminders={reminders} activity={activity} setPage={setPage} user={user} onToggleReminder={toggleReminder} onOpenProfile={() => setShowProfileModal(true)} />;
    }
  };

  return (
    <div className="app-layout">
      {/* Desktop Sidebar */}
      <aside className="sidebar">
        <div className="sidebar-brand">
          <div className="sidebar-brand-icon">⏳</div>
          <h1>Gilded Hours</h1>
        </div>

        <nav className="sidebar-nav">
          {navItems.map(item => (
            <div key={item.key} className={`nav-item ${page === item.key ? 'active' : ''}`} onClick={() => setPage(item.key)}>
              <span className="nav-icon">{item.icon}</span>
              <span>{item.label}</span>
              {item.badge && <span className="nav-badge">{item.badge}</span>}
            </div>
          ))}
        </nav>

        {/* User profile card in sidebar */}
        <div
          className="user-sidebar-profile"
          onClick={() => setShowProfileModal(true)}
          title="Click to customize profile & avatar"
        >
          <UserAvatar avatar={user.avatar || '✨'} size={36} />
          <div className="user-sidebar-info">
            <div className="user-sidebar-name" title={user.name}>{user.name}</div>
            <div className="user-sidebar-handle">@{user.username || user.email?.split('@')[0]}</div>
          </div>
          <button
            type="button"
            className="user-sidebar-gear"
            onClick={(e) => { e.stopPropagation(); setShowProfileModal(true); }}
            title="Customize Profile & Sanctuary"
          >
            ⚙️
          </button>
          <button
            type="button"
            className="user-sidebar-logout"
            onClick={(e) => { e.stopPropagation(); onLogout(); }}
            title="Sign out"
            style={{marginLeft:2}}
          >
            🚪
          </button>
        </div>
      </aside>

      {/* Mobile Bottom Nav */}
      <nav className="mobile-nav">
        {navItems.map(item => (
          <div key={item.key} className={`mobile-nav-item ${page === item.key ? 'active' : ''}`} onClick={() => setPage(item.key)}>
            <span className="nav-icon">{item.icon}</span>
            <span>{item.label}</span>
          </div>
        ))}
      </nav>

      {/* Main Content */}
      <main className="main-content">
        {/* Mobile top bar for user greeting & sign out */}
        <div className="mobile-top-bar">
          <div
            style={{display:'flex', alignItems:'center', gap:10, cursor:'pointer'}}
            onClick={() => setShowProfileModal(true)}
            title="Customize profile & avatar"
          >
            <UserAvatar avatar={user.avatar || '✨'} size={32} />
            <div>
              <div style={{fontWeight:600, fontSize:'0.88rem'}}>{user.name}</div>
              <div style={{fontSize:'0.72rem', color:'var(--text-muted)'}}>@{user.username}</div>
            </div>
          </div>
          <div style={{display:'flex', gap:6, alignItems:'center'}}>
            <button className="btn btn-secondary btn-sm" onClick={() => setShowProfileModal(true)} style={{padding:'5px 10px'}}>
              ⚙️ Profile
            </button>
            <button className="btn btn-secondary btn-sm" onClick={onLogout} style={{padding:'5px 10px', gap:4}}>
              🚪
            </button>
          </div>
        </div>

        {renderPage()}

        {/* Real-time Reminder Alert Toast */}
        {activeToastReminder && (
          <div className="reminder-toast-container">
            <div className="reminder-toast">
              <div className="reminder-toast-header">
                <span style={{fontSize:'1.3rem'}}>🔔</span>
                <div className="reminder-toast-title">Reminder Due Now</div>
                <button
                  className="btn btn-ghost btn-sm"
                  style={{marginLeft:'auto', padding:'2px 6px'}}
                  onClick={() => setActiveToastReminder(null)}
                >
                  ✕
                </button>
              </div>
              <div style={{fontWeight:600, fontSize:'0.95rem', marginBottom:4}}>
                {activeToastReminder.title}
              </div>
              {activeToastReminder.note && (
                <div style={{fontSize:'0.82rem', color:'var(--text-secondary)', marginBottom:8}}>
                  {activeToastReminder.note}
                </div>
              )}
              <div className="reminder-toast-actions">
                <button
                  className="btn btn-primary btn-sm"
                  onClick={() => {
                    toggleReminder(activeToastReminder.id);
                    setActiveToastReminder(null);
                  }}
                >
                  ✓ Mark Done
                </button>
                <button
                  className="btn btn-secondary btn-sm"
                  onClick={() => {
                    const now = new Date();
                    now.setMinutes(now.getMinutes() + 10);
                    const newDt = now.toISOString().slice(0, 16);
                    setReminders(prev => prev.map(r => r.id === activeToastReminder.id ? { ...r, datetime: newDt } : r));
                    logActivity('reminder', `Snoozed reminder: "${activeToastReminder.title}" (+10m)`, '⏰');
                    alertedIdsRef.current.delete(activeToastReminder.id);
                    setActiveToastReminder(null);
                  }}
                >
                  ⏰ Snooze 10m
                </button>
              </div>
            </div>
          </div>
        )}

        {/* Profile & Avatar Customization Modal */}
        <ProfileModal
          open={showProfileModal}
          onClose={() => setShowProfileModal(false)}
          user={user}
          onUpdateUser={onUpdateUser}
          onLogActivity={logActivity}
        />
      </main>
    </div>
  );
}

// ===== ROOT APP WITH AUTH ROUTING =====
function App() {
  const [currentUser, setCurrentUser] = useState(() => getActiveUser());

  useEffect(() => {
    if (currentUser?.themeAccent) {
      applyThemeAccent(currentUser.themeAccent);
    }
  }, [currentUser?.themeAccent]);

  const handleLogin = (user) => {
    // Purge any fake starter data across all tabs for this user on login
    purgeAllFakeUserData(user.id);

    localStorage.setItem(AUTH_ACTIVE_USER_KEY, JSON.stringify(user));
    if (user.themeAccent) {
      applyThemeAccent(user.themeAccent);
    }
    setCurrentUser(user);
  };

  const handleLogout = () => {
    localStorage.removeItem(AUTH_ACTIVE_USER_KEY);
    setCurrentUser(null);
  };

  const handleUpdateUser = (updatedUser) => {
    // 1. Update in registered users registry
    const users = getRegisteredUsers();
    const idx = users.findIndex(u => u.id === updatedUser.id);
    if (idx !== -1) {
      users[idx] = updatedUser;
    } else {
      users.push(updatedUser);
    }
    saveRegisteredUsers(users);

    // 2. Update active user session
    localStorage.setItem(AUTH_ACTIVE_USER_KEY, JSON.stringify(updatedUser));

    // 3. Update React state
    setCurrentUser(updatedUser);
  };

  if (!currentUser) {
    return <AuthScreen onLogin={handleLogin} />;
  }

  return (
    <AuthenticatedApp
      key={currentUser.id}
      user={currentUser}
      onLogout={handleLogout}
      onUpdateUser={handleUpdateUser}
    />
  );
}

// ===== MOUNT =====
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
